# 一键启动：MySQL8 + 应用（Tomcat9）
# 用法：docker compose up -d，浏览器打开 http://localhost:8080/demo
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: lab_equipment
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 如需外置数据库连接，可在 jdbc.properties 读取处扩展环境变量覆盖
      MYSQL_HOST: mysql

volumes:
  mysql-data:
